- id: q1
  question: >-
    Your support bot states refund windows and SLA terms confidently and wrongly. The policies live
    in documents that change every quarter. A teammate proposes fine-tuning on the policy documents.
    What should you do instead?
  options:
    - >-
      Fine-tune anyway, then schedule a retraining run every quarter when the policies change.
    - >-
      Add retrieval over the policy documents so answers are grounded and can cite their source.
    - >-
      Write the current refund windows into the system prompt and update it by hand each quarter.
    - >-
      Fine-tune a smaller model on the policies, since it is cheaper to retrain on each update.
  correct: 1
  explanation: >-
    This is a knowledge problem with facts that change, so retrieval resolves it at the first
    question of the framework. A fact-tuned model freezes the policy, cannot cite it and
    confabulates around the gaps.
- id: q2
  question: >-
    Constrained decoding keeps your JSON shape valid, but the model puts the customer's name in
    `company` for sole traders. Field descriptions and few-shot examples took the error from 12% to
    8%, then four measured prompt versions plateaued. What is the best reading of this?
  options:
    - >-
      It is a knowledge gap about sole traders, so retrieval of company records is the right fix.
    - >-
      Prompting is not exhausted until you have tried at least ten more prompt versions first.
    - >-
      Fine-tuning is a legitimate candidate, pending a TCO model and a quantified value.
    - >-
      The schema is the problem, so tighter constrained decoding will remove the semantic errors.
  correct: 2
  explanation: >-
    It is neither a knowledge nor a shape problem, prompting has plateaued with measured evidence,
    and the right behavior is easier to demonstrate than describe. That makes fine-tuning a
    candidate, but the decision still needs the cost and value numbers.
- id: q3
  question: >-
    A frontier model classifies 2M support tickets a month at 0.94 accuracy. Quality is fine; the
    monthly bill is the complaint. Which approach fits this problem best?
  options:
    - >-
      Distil the task into a small fine-tuned model, with a router for low-confidence cases.
    - >-
      Add retrieval of past labelled tickets so the frontier model needs fewer reasoning steps.
    - >-
      Keep the frontier model and shorten the prompt, since cost is mostly driven by input size.
    - >-
      Fine-tune the frontier model itself so it reaches higher accuracy on the same traffic volume.
  correct: 0
  explanation: >-
    This is a cost problem on a narrow, high-volume task, which is the strongest fine-tuning case:
    a small tuned model does the job far cheaper, and a router sends uncertain cases back to the
    large model.
- id: q4
  question: >-
    A proposed fine-tune cuts a semantic error rate from 8% to 1%, and you have a two-year TCO
    estimate. Your manager asks whether to approve it. What is still missing before you can answer?
  options:
    - >-
      A training loss curve from a pilot run showing that the error rate really does go down.
    - >-
      A larger dataset, because a decision like this needs 10,000 examples before it is credible.
    - >-
      A check that the TCO includes idle GPU time, since that is the line most teams forget.
    - >-
      The value of the improvement in a real unit, such as hours of correction saved per year.
  correct: 3
  explanation: >-
    A rate change does not say whether the cost is worth paying. Converting it into hours, errors
    avoided or dollars is what lets you compare it against the TCO and justify the spend.
