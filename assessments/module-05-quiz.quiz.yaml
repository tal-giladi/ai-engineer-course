- id: q1
  question: >-
    A documentation assistant gives wrong answers. The metric vector is context recall 0.94, context
    precision 0.38, faithfulness 0.62. Which failure mode is it, and what is the fix?
  options:
    - >-
      Retrieval miss; re-chunk the corpus and try a different embedding model before anything else.
    - >-
      Generation drift; add grounding structure, since faithfulness is the lowest of the scores.
    - >-
      Ranking failure; add a reranker, since the material is retrieved but buried below the cutoff.
    - >-
      Context assembly; deduplicate and reorder the chunks, since faithfulness is low after ranking.
  correct: 2
  explanation: >-
    High recall says retrieval found it; low precision says it is buried. Faithfulness suffers
    downstream because the model works from the wrong material at the top, so the fix is reranking.
- id: q2
  question: >-
    Another pipeline scores context recall 0.91, context precision 0.86 and faithfulness 0.44. Spot
    checks show answers describing a previous API version. What do you fix?
  options:
    - >-
      Generation: enforce grounding with a claims-with-support contract and validate citations.
    - >-
      Retrieval: add hybrid search, because older versions outscore new ones in dense retrieval.
    - >-
      Ranking: retrieve 50 and rerank to 5, so the current version's chunks are placed at the top.
    - >-
      Query rewriting: add the version number to every query before it is sent to the retriever.
  correct: 0
  explanation: >-
    Retrieval and ranking are both good, so the model has what it needs and is not using it. That is
    generation drift from training memory, fixed by grounding structure and citation validation.
- id: q3
  question: >-
    A pipeline scores context recall 0.42, context precision 0.88 and faithfulness 0.91. In a review,
    someone presents the 0.91 as evidence that the generation layer is in good shape. What is wrong
    with that reading?
  options:
    - >-
      Nothing; faithfulness is measured separately from retrieval, so 0.91 still stands on its own.
    - >-
      The faithfulness judge is probably uncalibrated, since scores above 0.9 are usually inflated.
    - >-
      Precision at 0.88 is the real concern, since it shows the ranking stage is close to failing.
    - >-
      Recall is the first low value, so faithfulness to a context lacking the answer means little.
  correct: 3
  explanation: >-
    Read the vector top-down and stop at the first low value. The model is faithfully working from a
    context that never held the answer, so the high score describes correct behaviour in a broken pipeline.
- id: q4
  question: >-
    Recall 0.93, precision 0.84 and faithfulness 0.90 all look healthy, but answer relevance is 0.51.
    The answers are well supported by their sources. What is the most likely cause?
  options:
    - >-
      The reranker is ordering chunks by topic rather than by how well they answer the question.
    - >-
      Query rewriting drifted, so the system retrieved for and answered a different question.
    - >-
      The model is answering from training memory, so its claims miss what the user asked about.
    - >-
      The context is too long, so the model loses the question that sits at the start of the prompt.
  correct: 1
  explanation: >-
    Everything is sound except relevance, so the answers are faithful to something other than the
    question. Over-aggressive multi-query or paraphrase drift is the usual cause; check the rewriter.
- id: q5
  question: >-
    Two failing queries look identical to a user: a plausible, confidently wrong answer. For query A
    the right chunk is not in the top 100 candidates. For query B it is at rank 23 with a cutoff of 5.
    The team plans to re-chunk and swap embedding models for both. What do you say?
  options:
    - >-
      Agree, because in both cases the model never saw the chunk, so retrieval has to be improved first.
    - >-
      That fits A; B is a ranking failure, which a reranker fixes without re-chunking or re-indexing.
    - >-
      That fits B; A is a ranking failure, because the chunk simply fell below a larger cutoff of 100.
    - >-
      Neither needs it; raising the cutoff to 100 for both puts the right chunk in front of the model.
  correct: 1
  explanation: >-
    The rank of the expected chunk in a wide candidate list separates them: absent at k=100 is a
    retrieval miss, present at rank 23 is ranking. Re-chunking for B is the common, expensive mistake.
- id: q6
  question: >-
    Over a hybrid baseline, conversational rewriting lifts the conversational stratum from 0.52 to
    0.89 for +180 ms; decomposition lifts multi-hop from 0.72 to 0.88 for +340 ms; multi-query adds
    one recall point for +180 ms more; HyDE lowers recall and adds the most latency. Which set do you adopt?
  options:
    - >-
      All four, because each one shows a gain on at least one of the strata you measured.
    - >-
      Multi-query and HyDE only, because they have the highest aggregate recall in the table.
    - >-
      Conversational rewriting only, because every extra round trip lands on time-to-first-token.
    - >-
      Conversational rewriting and decomposition; reject multi-query and HyDE on the numbers.
  correct: 3
  explanation: >-
    The first two win large gains on the strata they target. Multi-query's one point is inside the
    noise band of a 60-item set, and HyDE made things worse at the highest cost.
- id: q7
  question: >-
    Sweeping rerank_k gives answer quality 0.81 at 3, 0.85 at 5, 0.84 at 8, 0.79 at 12 and 0.71 at 20,
    with cost rising at each step. Twenty chunks fit easily in the context window. What explains the
    decline past 5?
  options:
    - >-
      Relevant material is diluted, and models attend poorly to the middle of long contexts.
    - >-
      The reranker's scores become less accurate when it has to return a larger set of chunks.
    - >-
      The judge is noisy at this sample size, so the falling scores are probably not a real trend.
    - >-
      Later chunks are cut off by token limits, so the model receives less material than it seems.
  correct: 0
  explanation: >-
    More chunks give the model more tangents and push material into the weakly attended middle. The
    decline is steady and large, so it is not noise, and the window is not exceeded.
- id: q8
  question: >-
    The same reranked top-5 chunks are assembled four ways: as ranked, then with deduplication, then
    with ordering for attention, then with small-to-big expansion. Quality rises at each step. Which
    step is the only one that increases context tokens?
  options:
    - >-
      Deduplication, because the threshold check needs extra metadata in the assembled prompt.
    - >-
      Ordering for attention, because the second-best chunk is repeated at the end of the context.
    - >-
      Small-to-big expansion, because each chunk grows to its parent section or its neighbours.
    - >-
      None of them; all three keep the same five chunks, so the context token count cannot change.
  correct: 2
  explanation: >-
    Deduplication cut tokens by about 28% and reordering is free. Expansion trades extra tokens for
    surrounding context, which is why it is the one step that costs more.
- id: q9
  question: >-
    You add a check that rejects any citation whose ID is not in the retrieved set and routes the
    error to the repair loop. Which failure can still reach users?
  options:
    - >-
      A citation to a file that does not exist anywhere in the documentation corpus at all.
    - >-
      A citation to a real document that was not retrieved for this particular query.
    - >-
      A citation that looks plausible but uses a section anchor the retriever never returned.
    - >-
      A valid, retrieved citation attached to a claim the cited chunk does not support.
  correct: 3
  explanation: >-
    The ID check catches fabricated and not-retrieved citations. A real citation on an unsupported
    claim needs support verification, a second model call, which faithfulness measures at eval time.
- id: q10
  question: >-
    For a customer-facing assistant you shipped the strict refusal setting (missed refusal 0.06, false
    refusal 0.19) over the permissive one (0.58 and 0.02). The false refusals are mostly ambiguous
    queries. What is the best next move?
  options:
    - >-
      Answer the likely reading of ambiguous queries and state which case the answer covers.
    - >-
      Switch to the permissive setting, since its false refusal rate is almost ten times lower.
    - >-
      Loosen the refusal procedure for every query until false refusals fall near the old 0.02.
    - >-
      Accept 0.19 as the cost of safety, since any change would raise the missed refusal rate.
  correct: 0
  explanation: >-
    Loosening globally raises missed refusals, the dangerous direction for customers. A targeted
    clarification path for the ambiguous stratum cut false refusal to 0.09 with missed refusal unchanged.
